name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fishing/package-lock.json

      - name: Install
        run: npm ci

      - name: API unit tests
        run: npm test --prefix apps/api

      - name: API build
        run: npm run build --prefix apps/api

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: AI path unit tests
        run: python3 -m unittest discover -s ai/tests -t ai
